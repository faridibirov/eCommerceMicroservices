services:
 mysql-container:
  image: mysql
  environment:
   MYSQL_ROOT_PASSWORD: admin
  ports:
   - "3306:3306"
  volumes:
   - ./mysql-init:/docker-entrypoint-inidb.d
  networks:
   - products-microservice-network
  hostname: mysql-host-productsmicroservice

 products-microservice:
  image: faridibirov/ecommerce-products-microservice:v1.0
  environment:
   MYSQL_HOST: mysql-host-productsmicroservice
   MYSQL_PASSWORD: admin
  ports:
   - "8080:8080"
  networks:
   - products-microservice-network

networks:
 products-microservice-network:
  driver: bridge
